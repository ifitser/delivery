name: CI
on:
  push:
    branches: [main, feat/fase-0-cimientos]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verificar vulnerabilidades de dependencias
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for(const [name,v] of Object.entries(a.vulnerabilities||{})){ if(v.severity==='critical'||v.severity==='high') console.log(name, v.severity, JSON.stringify(v.via), 'fix:', JSON.stringify(v.fixAvailable)); }"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
