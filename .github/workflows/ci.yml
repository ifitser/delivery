name: CI
on:
  push:
    branches: [main, feat/fase-0-cimientos]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verificar vulnerabilidades de dependencias
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for(const [name,v] of Object.entries(a.vulnerabilities||{})){ if(v.severity==='critical'||v.severity==='high') console.log(name, v.severity, JSON.stringify(v.via), 'fix:', JSON.stringify(v.fixAvailable)); }"
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Smoke test del servidor empaquetado
        run: |
          export JWT_SECRET="CI_SOLO_PRUEBA_012345678901234567890123456789"
          export API_PORT=3917
          export DATABASE_PATH=../../data/ci.sqlite
          export DELIVERY_SERVE_WEB=true
          export WEB_ORIGIN=http://localhost:3917
          export WHATSAPP_RESUME=false
          npm run start -w @delivery/api > /tmp/delivery-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/smoke.mjs http://127.0.0.1:3917 || { cat /tmp/delivery-api.log; exit 1; }
