# Solo para pruebas locales: puerto vinculado a loopback, sin exposición pública.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3001"
    env_file:
      - .env
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
      WEB_ORIGIN: "http://localhost:8080"
      DELIVERY_SERVE_WEB: "true"
      DATABASE_PATH: "../../data/delivery.sqlite"
      WHATSAPP_RESUME: "false"
    volumes:
      - delivery_data:/app/data
      - delivery_uploads:/app/apps/api/storage/uploads
      - delivery_backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
volumes:
  delivery_data:
  delivery_uploads:
  delivery_backups:
